<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EBE1"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </linearGradient>
    <linearGradient id="bottleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4D3E"/>
      <stop offset="25%" stop-color="#2D735D"/>
      <stop offset="50%" stop-color="#3D8B72"/>
      <stop offset="75%" stop-color="#2D735D"/>
      <stop offset="100%" stop-color="#184336"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#251409" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#bgG)"/>
  
  <!-- Podium -->
  <ellipse cx="300" cy="670" rx="200" ry="25" fill="#C9A87C" opacity="0.35"/>
  <ellipse cx="300" cy="660" rx="160" ry="16" fill="#3A2318" opacity="0.15"/>

  <!-- Bottle Group -->
  <g filter="url(#shadow)">
    <!-- Pump Dispenser -->
    <rect x="285" y="110" width="30" height="40" rx="4" fill="url(#goldG)"/>
    <path d="M255 125 L345 125 C345 120 340 115 330 115 L260 115 Z" fill="#251409"/>
    <path d="M255 125 C240 125 230 135 220 145 L225 150 C235 140 245 133 255 133 Z" fill="#251409"/>
    <rect x="278" y="145" width="44" height="22" rx="3" fill="url(#goldG)"/>

    <!-- Bottle Neck -->
    <rect x="270" y="165" width="60" height="30" fill="#1B4D3E"/>

    <!-- Bottle Body (1000ml) -->
    <path d="M 230 195 
             C 230 185, 270 175, 300 175 
             C 330 175, 370 185, 370 195 
             L 380 580 
             C 380 620, 220 620, 220 580 
             Z" fill="url(#bottleG)"/>

    <!-- Glass Highlights -->
    <path d="M 240 210 L 245 570" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
    <path d="M 252 220 L 255 550" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

    <!-- Label -->
    <rect x="240" y="270" width="120" height="260" rx="6" fill="#FAF6F0"/>
    <rect x="245" y="275" width="110" height="250" rx="4" fill="none" stroke="#C9A87C" stroke-width="1"/>

    <!-- Label Content -->
    <text x="300" y="315" font-family="'Fraunces', serif" font-size="16" font-weight="700" fill="#251409" text-anchor="middle" letter-spacing="3">PROXIMA</text>
    <text x="300" y="332" font-family="'Work Sans', sans-serif" font-size="8" font-weight="500" fill="#C9A87C" text-anchor="middle" letter-spacing="2">PARIS — LAGOS</text>
    
    <line x1="260" y1="345" x2="340" y2="345" stroke="#C9A87C" stroke-width="0.75"/>
    
    <text x="300" y="370" font-family="'Fraunces', serif" font-size="13" font-style="italic" fill="#1B4D3E" text-anchor="middle">Peau de Lune</text>
    <text x="300" y="390" font-family="'Work Sans', sans-serif" font-size="11" font-weight="600" fill="#251409" text-anchor="middle" letter-spacing="1">GEL DOUCHE</text>
    <text x="300" y="405" font-family="'Work Sans', sans-serif" font-size="8" font-weight="500" fill="#555" text-anchor="middle">SHOWER GEL</text>

    <!-- Badge -->
    <rect x="255" y="420" width="90" height="20" rx="10" fill="#1B4D3E"/>
    <text x="300" y="433" font-family="'Work Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PLANTES NATURELLES</text>

    <text x="300" y="465" font-family="'Work Sans', sans-serif" font-size="8" fill="#666" text-anchor="middle">Exfolie &amp; Purifie</text>
    <text x="300" y="480" font-family="'Work Sans', sans-serif" font-size="7.5" fill="#888" text-anchor="middle">Éclat Naturel &amp; Fraîcheur</text>

    <line x1="270" y1="495" x2="330" y2="495" stroke="#EADCC8" stroke-width="0.5"/>
    <text x="300" y="515" font-family="'Work Sans', sans-serif" font-size="9" font-weight="600" fill="#251409" text-anchor="middle">1000 ml</text>
  </g>
</svg>
