<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFECD2"/>
      <stop offset="40%" stop-color="#FCB69F"/>
      <stop offset="80%" stop-color="#C9A87C"/>
      <stop offset="100%" stop-color="#3A2318"/>
    </radialGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C5A3C"/>
      <stop offset="40%" stop-color="#7B3F28"/>
      <stop offset="80%" stop-color="#542517"/>
      <stop offset="100%" stop-color="#3D180F"/>
    </linearGradient>
    <linearGradient id="glowHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Warm Atmosphere -->
  <rect width="800" height="1000" fill="url(#sunGlow)"/>

  <!-- Soft Botanical Silhouettes -->
  <path d="M 0 800 Q 150 650 300 820 T 600 780 T 800 900 L 800 1000 L 0 1000 Z" fill="#251409" opacity="0.45"/>
  <path d="M 50 100 Q 180 40 220 180 T 350 220" stroke="#FAF1D0" stroke-width="2" fill="none" opacity="0.25"/>

  <!-- Portrait Silhouette & Editorial Styling -->
  <g transform="translate(100, 150)">
    <!-- Shoulders & Neck -->
    <path d="M 80 650 C 120 480 180 400 240 370 L 250 280 C 250 280 290 280 320 280 L 330 370 C 390 400 460 480 500 650 Z" fill="url(#skinTone)"/>
    
    <!-- Face Contour -->
    <path d="M 230 200 C 220 300 250 370 290 380 C 330 370 360 300 350 200 C 340 100 240 100 230 200 Z" fill="url(#skinTone)"/>
    
    <!-- Editorial High-Glow Cheekbone & Forehead light -->
    <ellipse cx="255" cy="245" rx="28" ry="40" fill="url(#glowHighlight)" transform="rotate(-15 255 245)"/>
    <ellipse cx="325" cy="245" rx="28" ry="40" fill="url(#glowHighlight)" transform="rotate(15 325 245)"/>
    <ellipse cx="290" cy="180" rx="35" ry="20" fill="url(#glowHighlight)"/>

    <!-- Sculptural Natural Hair Silhouette -->
    <path d="M 210 190 C 180 130 190 40 290 35 C 390 40 400 130 370 190 C 385 130 350 70 290 70 C 230 70 195 130 210 190 Z" fill="#14100D"/>
    <ellipse cx="290" cy="120" rx="110" ry="90" fill="#14100D"/>

    <!-- Luxury Silk Garment -->
    <path d="M 120 620 Q 290 520 460 620 L 480 750 L 100 750 Z" fill="#EADCC8" opacity="0.95"/>
    <path d="M 290 540 L 290 750" stroke="#C9A87C" stroke-width="2" opacity="0.5"/>

    <!-- Hands Cradling Proxima Bottles -->
    <ellipse cx="290" cy="520" rx="80" ry="120" fill="#251409" opacity="0.3"/>
    
    <!-- Held Bottle (Lait Peau de Lune) -->
    <rect x="250" y="440" width="80" height="170" rx="14" fill="#1F6970"/>
    <rect x="270" y="415" width="40" height="25" rx="4" fill="#C9A87C"/>
    <rect x="260" y="490" width="60" height="70" rx="4" fill="#FAF6F0"/>
    <text x="290" y="525" font-family="'Fraunces', serif" font-size="9" font-weight="700" fill="#251409" text-anchor="middle">PROXIMA</text>
    <text x="290" y="540" font-family="'Work Sans', sans-serif" font-size="6" fill="#1F6970" text-anchor="middle">Peau de Lune</text>
  </g>

  <!-- Editorial Typographic Overlay -->
  <rect x="50" y="860" width="700" height="90" rx="16" fill="#251409" opacity="0.85"/>
  <text x="80" y="902" font-family="'Fraunces', serif" font-size="22" font-weight="500" fill="#F8F3EC">African understanding. French science.</text>
  <text x="80" y="928" font-family="'Work Sans', sans-serif" font-size="13" font-weight="400" fill="#C9A87C">Crafted for radiant melanin skin in warm, humid climates.</text>
</svg>
