<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLait" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F1EB"/>
      <stop offset="100%" stop-color="#E9DFD3"/>
    </linearGradient>
    <linearGradient id="bottleTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14464B"/>
      <stop offset="25%" stop-color="#1F6970"/>
      <stop offset="50%" stop-color="#2B838C"/>
      <stop offset="75%" stop-color="#1F6970"/>
      <stop offset="100%" stop-color="#123B3F"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58C8A"/>
      <stop offset="100%" stop-color="#C5535A"/>
    </linearGradient>
    <filter id="shadowLait" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="22" flood-color="#251409" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bgLait)"/>
  
  <ellipse cx="300" cy="670" rx="190" ry="24" fill="#C9A87C" opacity="0.3"/>
  <ellipse cx="300" cy="660" rx="150" ry="16" fill="#3A2318" opacity="0.12"/>

  <g filter="url(#shadowLait)">
    <!-- Pump Dispenser -->
    <rect x="286" y="130" width="28" height="35" rx="3" fill="#C9A87C"/>
    <path d="M260 145 L340 145 C340 140 335 135 325 135 L265 135 Z" fill="#14100D"/>
    <path d="M260 145 C248 145 240 152 232 160 L236 164 C244 156 252 152 260 152 Z" fill="#14100D"/>
    <rect x="280" y="160" width="40" height="20" rx="3" fill="#C9A87C"/>

    <!-- Bottle Neck -->
    <rect x="272" y="180" width="56" height="25" fill="#14464B"/>

    <!-- Bottle Body (550ml) -->
    <path d="M 235 205 
             C 235 195, 270 190, 300 190 
             C 330 190, 365 195, 365 205 
             L 375 580 
             C 375 620, 225 620, 225 580 
             Z" fill="url(#bottleTeal)"/>

    <!-- Highlight -->
    <path d="M 245 220 L 248 575" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.25"/>
    <path d="M 255 230 L 257 560" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

    <!-- Center Label -->
    <rect x="245" y="275" width="110" height="260" rx="6" fill="#FFFFFF"/>
    <rect x="250" y="280" width="100" height="250" rx="4" fill="none" stroke="#C9A87C" stroke-width="1"/>

    <!-- Text -->
    <text x="300" y="320" font-family="'Fraunces', serif" font-size="15" font-weight="700" fill="#251409" text-anchor="middle" letter-spacing="3">PROXIMA</text>
    <text x="300" y="336" font-family="'Work Sans', sans-serif" font-size="8" font-weight="500" fill="#C9A87C" text-anchor="middle" letter-spacing="2">PARIS — LAGOS</text>
    
    <line x1="265" y1="348" x2="335" y2="348" stroke="#C9A87C" stroke-width="0.75"/>
    
    <text x="300" y="372" font-family="'Fraunces', serif" font-size="13" font-style="italic" fill="#1F6970" text-anchor="middle">Peau de Lune</text>
    <text x="300" y="392" font-family="'Work Sans', sans-serif" font-size="11" font-weight="600" fill="#251409" text-anchor="middle" letter-spacing="1">LAIT CORPOREL</text>
    <text x="300" y="407" font-family="'Work Sans', sans-serif" font-size="8" font-weight="500" fill="#666" text-anchor="middle">BODY LOTION</text>

    <!-- Badge -->
    <rect x="258" y="423" width="84" height="20" rx="10" fill="url(#roseAccent)"/>
    <text x="300" y="436" font-family="'Work Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">HYDRATATION INTENSE</text>

    <text x="300" y="468" font-family="'Work Sans', sans-serif" font-size="8" fill="#555" text-anchor="middle">Extraits Botaniques &amp; Lipides</text>
    <text x="300" y="483" font-family="'Work Sans', sans-serif" font-size="7.5" fill="#777" text-anchor="middle">Formule Légère Climat Chaud</text>

    <line x1="275" y1="497" x2="325" y2="497" stroke="#EADCC8" stroke-width="0.5"/>
    <text x="300" y="517" font-family="'Work Sans', sans-serif" font-size="9" font-weight="600" fill="#251409" text-anchor="middle">550 ml</text>
  </g>
</svg>
