<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHuile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#E5D9C8"/>
    </linearGradient>
    <linearGradient id="oilGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#234E28"/>
      <stop offset="30%" stop-color="#3C7E44"/>
      <stop offset="60%" stop-color="#55A55E"/>
      <stop offset="100%" stop-color="#1B4220"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5E8BA"/>
      <stop offset="100%" stop-color="#9E781B"/>
    </linearGradient>
    <filter id="shadowHuile" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#251409" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bgHuile)"/>
  
  <ellipse cx="300" cy="670" rx="170" ry="22" fill="#C9A87C" opacity="0.32"/>
  <ellipse cx="300" cy="660" rx="130" ry="14" fill="#3A2318" opacity="0.12"/>

  <g filter="url(#shadowHuile)">
    <!-- Dropper / Cap -->
    <path d="M285 130 C285 115 315 115 315 130 Z" fill="#14100D"/>
    <rect x="275" y="130" width="50" height="50" rx="4" fill="url(#goldCap)"/>
    <rect x="270" y="175" width="60" height="15" rx="2" fill="url(#goldCap)"/>

    <!-- Bottle Neck -->
    <rect x="272" y="190" width="56" height="25" fill="#234E28"/>

    <!-- Rounded Shoulder Bottle Body (300ml) -->
    <path d="M 235 240 
             C 235 205, 270 205, 300 205 
             C 330 205, 365 205, 365 240 
             L 365 570 
             C 365 605, 235 605, 235 570 
             Z" fill="url(#oilGreen)"/>

    <!-- Glass reflections -->
    <path d="M 248 245 L 250 565" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.3"/>
    <path d="M 258 255 L 260 550" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

    <!-- Label -->
    <rect x="250" y="290" width="100" height="240" rx="5" fill="#FAF6F0"/>
    <rect x="254" y="294" width="92" height="232" rx="3" fill="none" stroke="#C9A87C" stroke-width="1"/>

    <text x="300" y="330" font-family="'Fraunces', serif" font-size="14" font-weight="700" fill="#251409" text-anchor="middle" letter-spacing="3">PROXIMA</text>
    <text x="300" y="344" font-family="'Work Sans', sans-serif" font-size="7.5" font-weight="500" fill="#C9A87C" text-anchor="middle" letter-spacing="2">PARIS — LAGOS</text>
    
    <line x1="268" y1="354" x2="332" y2="354" stroke="#C9A87C" stroke-width="0.75"/>
    
    <text x="300" y="376" font-family="'Fraunces', serif" font-size="12" font-style="italic" fill="#234E28" text-anchor="middle">Peau de Lune</text>
    <text x="300" y="394" font-family="'Work Sans', sans-serif" font-size="10" font-weight="600" fill="#251409" text-anchor="middle" letter-spacing="1">HUILE CORPORELLE</text>
    <text x="300" y="408" font-family="'Work Sans', sans-serif" font-size="7.5" font-weight="500" fill="#666" text-anchor="middle">BODY OIL</text>

    <!-- Actives Badge -->
    <rect x="258" y="420" width="84" height="20" rx="10" fill="#234E28"/>
    <text x="300" y="433" font-family="'Work Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">VITAMINE B3</text>

    <text x="300" y="462" font-family="'Work Sans', sans-serif" font-size="7.5" fill="#555" text-anchor="middle">Nourrit en Profondeur</text>
    <text x="300" y="475" font-family="'Work Sans', sans-serif" font-size="7" fill="#777" text-anchor="middle">Éclat Lumineux Naturel</text>

    <line x1="275" y1="488" x2="325" y2="488" stroke="#EADCC8" stroke-width="0.5"/>
    <text x="300" y="508" font-family="'Work Sans', sans-serif" font-size="8.5" font-weight="600" fill="#251409" text-anchor="middle">300 ml</text>
  </g>
</svg>
