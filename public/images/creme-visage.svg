<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCreme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F2"/>
      <stop offset="100%" stop-color="#ECE3D7"/>
    </linearGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A2318"/>
      <stop offset="35%" stop-color="#553524"/>
      <stop offset="70%" stop-color="#44291D"/>
      <stop offset="100%" stop-color="#251409"/>
    </linearGradient>
    <linearGradient id="goldJarLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C87A"/>
      <stop offset="40%" stop-color="#FAF1D0"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E781B"/>
    </linearGradient>
    <filter id="shadowCreme" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="22" flood-color="#251409" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bgCreme)"/>
  
  <ellipse cx="300" cy="590" rx="200" ry="24" fill="#C9A87C" opacity="0.3"/>
  <ellipse cx="300" cy="582" rx="155" ry="16" fill="#3A2318" opacity="0.12"/>

  <g filter="url(#shadowCreme)">
    <!-- Lid Top & Rim -->
    <ellipse cx="300" cy="245" rx="145" ry="30" fill="url(#goldJarLid)"/>
    <path d="M 155 245 C 155 255 155 285 155 295 C 155 330 445 330 445 295 L 445 245 Z" fill="url(#goldJarLid)"/>
    <ellipse cx="300" cy="295" rx="145" ry="30" fill="#B38B22"/>

    <!-- Jar Body (Heavy base luxury cosmetic glass) -->
    <path d="M 160 305 
             L 165 490 
             C 165 550, 435 550, 435 490 
             L 440 305 
             Z" fill="url(#jarGlass)"/>

    <!-- Glass Highlights -->
    <path d="M 180 320 L 185 480" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
    <path d="M 195 330 L 198 470" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

    <!-- Jar Label -->
    <rect x="200" y="345" width="200" height="150" rx="6" fill="#FAF6F0"/>
    <rect x="206" y="351" width="188" height="138" rx="4" fill="none" stroke="#C9A87C" stroke-width="1"/>

    <text x="300" y="380" font-family="'Fraunces', serif" font-size="16" font-weight="700" fill="#251409" text-anchor="middle" letter-spacing="3">PROXIMA</text>
    <text x="300" y="395" font-family="'Work Sans', sans-serif" font-size="8" font-weight="500" fill="#C9A87C" text-anchor="middle" letter-spacing="2">PARIS — LAGOS</text>

    <line x1="250" y1="404" x2="350" y2="404" stroke="#C9A87C" stroke-width="0.75"/>

    <text x="300" y="423" font-family="'Fraunces', serif" font-size="12.5" font-style="italic" fill="#553524" text-anchor="middle">Peau de Lune</text>
    <text x="300" y="440" font-family="'Work Sans', sans-serif" font-size="11" font-weight="600" fill="#251409" text-anchor="middle" letter-spacing="1">CRÈME DE VISAGE</text>
    <text x="300" y="454" font-family="'Work Sans', sans-serif" font-size="8" font-weight="500" fill="#777" text-anchor="middle">HYDRATATION &amp; ÉCLAT</text>

    <text x="300" y="475" font-family="'Work Sans', sans-serif" font-size="9" font-weight="600" fill="#251409" text-anchor="middle">50 ml — FLORALE PLUS</text>
  </g>
</svg>
