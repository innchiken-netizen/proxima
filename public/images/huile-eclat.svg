<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEclat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4F1"/>
      <stop offset="100%" stop-color="#EEDDD7"/>
    </linearGradient>
    <linearGradient id="roseGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C2D3A"/>
      <stop offset="35%" stop-color="#C04A58"/>
      <stop offset="70%" stop-color="#DA6875"/>
      <stop offset="100%" stop-color="#7B212D"/>
    </linearGradient>
    <linearGradient id="goldDropper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E781B"/>
    </linearGradient>
    <filter id="shadowEclat" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#251409" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bgEclat)"/>
  
  <ellipse cx="300" cy="670" rx="170" ry="22" fill="#C9A87C" opacity="0.3"/>
  <ellipse cx="300" cy="660" rx="130" ry="14" fill="#3A2318" opacity="0.12"/>

  <g filter="url(#shadowEclat)">
    <!-- Pipette Bulb & Gold Collar -->
    <path d="M285 120 C285 105 315 105 315 120 Z" fill="#FFFFFF"/>
    <rect x="274" y="120" width="52" height="52" rx="4" fill="url(#goldDropper)"/>
    <rect x="270" y="168" width="60" height="15" rx="2" fill="url(#goldDropper)"/>

    <!-- Bottle Neck -->
    <rect x="272" y="183" width="56" height="25" fill="#8C2D3A"/>

    <!-- Bottle Body -->
    <path d="M 235 235 
             C 235 200, 270 200, 300 200 
             C 330 200, 365 200, 365 235 
             L 365 570 
             C 365 605, 235 605, 235 570 
             Z" fill="url(#roseGlass)"/>

    <!-- Highlights -->
    <path d="M 248 240 L 250 565" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.32"/>
    <path d="M 258 250 L 260 550" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

    <!-- Label -->
    <rect x="250" y="285" width="100" height="245" rx="5" fill="#FAF6F0"/>
    <rect x="254" y="289" width="92" height="237" rx="3" fill="none" stroke="#C9A87C" stroke-width="1"/>

    <text x="300" y="325" font-family="'Fraunces', serif" font-size="14" font-weight="700" fill="#251409" text-anchor="middle" letter-spacing="3">PROXIMA</text>
    <text x="300" y="339" font-family="'Work Sans', sans-serif" font-size="7.5" font-weight="500" fill="#C9A87C" text-anchor="middle" letter-spacing="2">PARIS — LAGOS</text>

    <line x1="268" y1="349" x2="332" y2="349" stroke="#C9A87C" stroke-width="0.75"/>

    <text x="300" y="371" font-family="'Fraunces', serif" font-size="12" font-style="italic" fill="#8C2D3A" text-anchor="middle">Florale Plus</text>
    <text x="300" y="389" font-family="'Work Sans', sans-serif" font-size="9.5" font-weight="600" fill="#251409" text-anchor="middle" letter-spacing="0.5">HUILE ÉCLAT PUR</text>
    <text x="300" y="403" font-family="'Work Sans', sans-serif" font-size="7.5" font-weight="500" fill="#666" text-anchor="middle">ACTIVE GLOW OIL</text>

    <!-- Badge -->
    <rect x="256" y="415" width="88" height="20" rx="10" fill="#A32B1E"/>
    <text x="300" y="428" font-family="'Work Sans', sans-serif" font-size="7" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ARBUTIN + NIACINAMIDE</text>

    <text x="300" y="456" font-family="'Work Sans', sans-serif" font-size="7.5" fill="#555" text-anchor="middle">Retinol &amp; Vitamine C</text>
    <text x="300" y="470" font-family="'Work Sans', sans-serif" font-size="7" fill="#777" text-anchor="middle">Rose Bulgare &amp; Botaniques</text>

    <line x1="275" y1="482" x2="325" y2="482" stroke="#EADCC8" stroke-width="0.5"/>
    <text x="300" y="504" font-family="'Work Sans', sans-serif" font-size="8.5" font-weight="600" fill="#251409" text-anchor="middle">150 ml</text>
  </g>
</svg>
